name: Refresh Bengaluru market inventory

on:
  schedule:
    # GitHub schedules run in UTC: 02:30 and 14:30 UTC are 08:00 and 20:00 IST.
    - cron: "30 2,14 * * *"
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Refresh eligible Bengaluru listings
        run: |
          curl --fail --silent --show-error --max-time 600 \
            "https://driveworthy.utkarsh2902.chatgpt.site/market-refresh?run=1"
